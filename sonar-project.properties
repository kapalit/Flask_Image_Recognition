# SonarQube Cloud configuration (CI-based analysis via GitHub Actions)
# Keys must match the project in SonarQube Cloud exactly
# (Project > Information shows both values).
sonar.projectKey=kapalit_Flask_Image_Recognition
sonar.organization=kapalit
sonar.projectName=Flask_Image_Recognition

# Analysis scope
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test_*.py,conftest.py
# Keep tests out of the main source set, and skip binaries, venvs, caches,
# sample images and reports that are not application code.
sonar.exclusions=test_*.py,conftest.py,venv/**,.venv/**,**/__pycache__/**,test_images/**,htmlcov/**,*.h5,*.pdf,.idea/**,.claude/**

# Python version and coverage report produced by pytest-cov in CI
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
