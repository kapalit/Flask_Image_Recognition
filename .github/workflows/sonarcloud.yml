name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so SonarQube Cloud can attribute new code and blame

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # --only-binary :all: installs wheels only, so no package setup.py
        # scripts run during installation (SonarQube githubactions:S8541).
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov=model --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud scan
        # Pinned to the full commit SHA of v6.0.0 so a moved tag cannot inject
        # different code (SonarQube githubactions:S7637).
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
