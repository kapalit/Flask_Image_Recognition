name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        # Installs only the exact versions and SHA-256 hashes recorded in
        # requirements-lock.txt (githubactions:S8544) and only prebuilt wheels,
        # so no package setup.py scripts run (githubactions:S8541).
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-lock.txt

      - name: Run Pylint
        run: pylint app.py model.py conftest.py test_*.py

      - name: Run pytest
        run: pytest -v
