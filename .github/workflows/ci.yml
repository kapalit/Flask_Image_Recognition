name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # --only-binary :all: installs wheels only, so no package setup.py
        # scripts run during installation (SonarQube githubactions:S8541).
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Run Pylint
        run: pylint app.py model.py conftest.py test_*.py

      - name: Run pytest
        run: pytest -v
